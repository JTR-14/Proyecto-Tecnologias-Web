<!DOCTYPE html>

            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#A855F7', background: '#0F172A', card: '#1E293B', bordercolor: '#334155', textsec: '#94A3B8' }

            }
        }

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

                        <button class="bg-primary hover:bg-purple-600 text-white p-2.5 rounded-lg transition-colors shadow-lg shadow-purple-500/30">
