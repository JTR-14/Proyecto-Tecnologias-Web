{% extends 'plantilla.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto p-6 max-w-2xl">
    <h1 class="text-3xl font-bold text-black dark:text-white mb-6">Editar Producto: {{ producto.nombre }}</h1>

    <div class="bg-black border border-white rounded-xl p-6 shadow-lg text-white">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form|crispy }}
            
            <div class="flex items-center gap-4 mt-6">
                <button type="submit" class="px-5 py-2.5 bg-primary text-white font-medium rounded-lg hover:bg-purple-600 transition-colors">
                    Actualizar Producto
                </button>
                <a href="{% url 'admin' %}" class="px-5 py-2.5 bg-gray-700 text-white font-medium rounded-lg hover:bg-gray-600 transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
